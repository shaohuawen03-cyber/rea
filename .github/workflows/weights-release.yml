name: weights-release

# One-off / reusable weights archiver: fetch a gpu-relay workflow artifact
# and publish it as a GitHub Release (prerelease) as assets.
#
# Why this exists: the Arena sandbox can only reach github.com (artifact zips
# live on an Azure blob host that is unreachable from the sandbox), so the
# archival must run on a GitHub-hosted runner. It is a MANUAL workflow — it
# does not run on push and does not touch the gpu-relay dispatch chain.
#
# Contents published per release:
#   dualamp-*.tar.gz       all *.pt + features_biophys_scaler.joblib + meta/
#   SHA256SUMS.txt         sha256 (and byte size via manifest) of packaged files
#   export_manifest.json   provenance: source run / kernel / commit / positives sha256
#
# Weights are candidate_v1_pilot artifacts unless the manifest says otherwise.
# Never publish positive_core_v2 weights through this path before v2 freeze.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'gpu-relay run id to fetch the artifact from (e.g. 43842046392)'
        required: false
        default: ''
      artifact_name:
        description: 'Artifact name in that run (e.g. gpu-relay-run-18)'
        required: true
        default: 'gpu-relay-run-18'
      release_tag:
        description: 'Release tag to create (must not already exist)'
        required: false
        default: ''
      release_title:
        description: 'Release title'
        required: false
        default: ''
      expected_pt:
        description: 'Expected number of .pt files (safety check)'
        required: false
        default: '15'
      kernel_status:
        description: 'Read-only Kaggle kernel status (owner/slug); when set, no release job runs'
        required: false
        default: ''

permissions:
  contents: write   # create the release + upload assets
  actions: read     # actions/download-artifact needs this for cross-run fetch

concurrency:
  group: weights-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  archive:
    if: ${{ inputs.kernel_status == '' && inputs.run_id != '' && inputs.release_tag != '' && inputs.release_title != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Download source artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/weights-src

      - name: Package weights + provenance
        id: pkg
        run: |
          set -euo pipefail
          python3 cloud-gpu/scripts/pack_release_assets.py /tmp/weights-src /tmp/pkg "${{ inputs.release_tag }}" "${{ inputs.expected_pt }}"
          echo "TARBALL=/tmp/${{ inputs.release_tag }}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Publish release (prerelease) with assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
          TITLE: ${{ inputs.release_title }}
        run: |
          set -euo pipefail
          {
            echo '> ⚠️ **candidate_v1_pilot_weights，不是 positive_core_v2，不可入论文；阈值内嵌于每个 .pt。**'
            echo ''
            echo '| 项 | 值 |'
            echo '| --- | --- |'
            echo '| 口径 | candidate_v1（未 Review_Result 回填） |'
            echo '| 来源 | gpu-relay run 43842046392 → kernel shaohuawen/dualamp-real5-20261116 |'
            echo '| 训练 commit | 8a2d232 |'
            echo '| 阳性 SHA256 | 7b6ea12136623e85218ba78cfd4b713985a3122b24c61650e536e724b768aa1d |'
            echo '| 模型 | M1 / M2 / M3 × seeds 1–5（60 ep，5 fold）；M0_RF 为 sklearn，未导出 .pt |'
            echo '| 测试 AUROC | M1 0.9767–0.9791 / M2 0.9796–0.9809 / M3 0.9770–0.9803 |'
            echo ''
            echo '内容：`model/`（15 × .pt）+ `features/biophys_scaler.joblib` + `meta/`（summary、D10/D11/D15、ablation、log、result.json）+ `SHA256SUMS.txt` + `export_manifest.json`。'
            echo ''
            echo '注意：测试集已参与模型比较，不是盲测；positive_core_v2 冻结后仍需正式重训并更新本 release。'
          } > /tmp/release_notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::release tag $TAG already exists — refusing to overwrite"
            exit 1
          fi
          gh release create "$TAG" "${{ steps.pkg.outputs.TARBALL }}" /tmp/pkg/SHA256SUMS.txt /tmp/pkg/export_manifest.json \
            --repo "$GITHUB_REPOSITORY" --prerelease --title "$TITLE" --notes-file /tmp/release_notes.md
          {
            echo '### Release published'
            echo ''
            echo "- tag: $TAG"
            echo "- assets:"
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | "  - \(.name) (\(.size) bytes)"'
          } >> "$GITHUB_STEP_SUMMARY"

  observe_kernel:
    if: ${{ inputs.kernel_status != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v4
        with:
          path: ~/.gpu-relay
          key: gpu-relay-vault-${{ github.run_id }}
          restore-keys: |
            gpu-relay-vault-
      - name: Install Kaggle CLI
        run: python -m pip install --quiet kaggle six
      - name: Read kernel status and safe report fields
        env:
          KERNEL_REF: ${{ inputs.kernel_status }}
        run: |
          python - <<'PY'
          import json, os, subprocess, sys, tempfile, urllib.request, urllib.error, re
          sys.path.insert(0, 'cloud-gpu/scripts')
          from gpu_ctl import resolve_kaggle_env
          env, source = resolve_kaggle_env()
          if not source:
              raise SystemExit('Kaggle credentials unavailable from relay vault')
          ref=os.environ['KERNEL_REF']
          st=subprocess.run(['kaggle','kernels','status',ref],env=env,text=True,capture_output=True,timeout=60)
          print('KERNEL_STATUS='+(st.stdout or st.stderr).strip())
          if st.returncode:
              raise SystemExit(st.returncode)
          d=tempfile.mkdtemp(prefix='kernel-observe-')
          out=subprocess.run(['kaggle','kernels','output',ref,'-p',d,'-o'],env=env,text=True,capture_output=True,timeout=180)
          print('OUTPUT_FETCH='+(out.stdout or out.stderr).strip()[:1000])
          safe={'kernel_ref':ref,'kernel_status':(st.stdout or st.stderr).strip()}
          token=env.get('KAGGLE_API_TOKEN','').strip()
          if token:
              req=urllib.request.Request('https://api.kaggle.com/v1/kernels.KernelsApiService/GetAcceleratorQuotaStatistics',data=b'{}',headers={'Authorization':'Bearer '+token,'Content-Type':'application/json','Accept':'application/json'},method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=30) as resp: quota=json.loads(resp.read().decode('utf-8'))
                  def seconds(v):
                      if isinstance(v,(int,float)): return float(v)
                      m=re.fullmatch(r'([0-9]+(?:\.[0-9]+)?)s',str(v or '').strip())
                      return float(m.group(1)) if m else None
                  g=quota.get('gpuQuota') or {}
                  used=seconds(g.get('timeUsed')); reserved=seconds(g.get('timeReserved')); total=seconds(g.get('totalTimeAllowed'))
                  safe['gpu_quota']={'time_used_seconds':used,'time_reserved_seconds':reserved,'total_allowed_seconds':total,'remaining_seconds':max(0,total-(used or 0)-(reserved or 0)) if total is not None else None,'quota_refresh_time':quota.get('quotaRefreshTime')}
              except urllib.error.HTTPError as e:
                  safe['gpu_quota_error']='HTTP '+str(e.code)
              except Exception as e:
                  safe['gpu_quota_error']=type(e).__name__+': '+str(e)[:200]
          else:
              safe['gpu_quota_error']='KAGGLE_API_TOKEN not available in relay vault; quota endpoint not queried'
          p=os.path.join(d,'v2_training_report.json')
          if os.path.isfile(p):
              data=json.load(open(p))
              for k in ('stage','dataset_version','training_started','status','error','started_utc','completed_utc','finished_utc','positive_records','positive_unique_sequences','test_positive_n','private_model_bundle'):
                  if k in data: safe[k]=data[k]
          os.makedirs('observer-output',exist_ok=True)
          json.dump(safe,open('observer-output/kernel-status.json','w'),ensure_ascii=False,indent=2)
          print('SAFE_SUMMARY='+json.dumps(safe,ensure_ascii=False))
          PY
      - name: Publish sanitized observation to branch
        if: always() && hashFiles('observer-output/kernel-status.json') != ''
        run: |
          set -euo pipefail
          dest="cloud-gpu/results/kernel-observations/${GITHUB_RUN_ID}.json"
          mkdir -p "$(dirname "$dest")"
          cp observer-output/kernel-status.json "$dest"
          git config user.name "kernel-observer[bot]"
          git config user.email "kernel-observer[bot]@users.noreply.github.com"
          git add "$dest"
          git commit -m "ops: record sanitized Kaggle kernel status"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kaggle-kernel-status-${{ github.run_id }}
          path: observer-output/
          if-no-files-found: ignore
          retention-days: 7
