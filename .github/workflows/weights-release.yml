name: weights-release

# One-off / reusable weights archiver: fetch a gpu-relay workflow artifact
# and publish it as a GitHub Release (prerelease) as assets.
#
# Why this exists: the Arena sandbox can only reach github.com (artifact zips
# live on an Azure blob host that is unreachable from the sandbox), so the
# archival must run on a GitHub-hosted runner. It is a MANUAL workflow — it
# does not run on push and does not touch the gpu-relay dispatch chain.
#
# Contents published per release:
#   dualamp-*.tar.gz       all *.pt + features_biophys_scaler.joblib + meta/
#   SHA256SUMS.txt         sha256 (and byte size via manifest) of packaged files
#   export_manifest.json   provenance: source run / kernel / commit / positives sha256
#
# Weights are candidate_v1_pilot artifacts unless the manifest says otherwise.
# Never publish positive_core_v2 weights through this path before v2 freeze.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'gpu-relay run id to fetch the artifact from (e.g. 43842046392)'
        required: true
      artifact_name:
        description: 'Artifact name in that run (e.g. gpu-relay-run-18)'
        required: true
        default: 'gpu-relay-run-18'
      release_tag:
        description: 'Release tag to create (must not already exist)'
        required: true
      release_title:
        description: 'Release title'
        required: true
      expected_pt:
        description: 'Expected number of .pt files (safety check)'
        required: false
        default: '15'
      publish_mode:
        description: 'tarball (one archive) or individual (one asset per .pt)'
        required: false
        default: 'tarball'

permissions:
  contents: write   # create the release + upload assets
  actions: read     # actions/download-artifact needs this for cross-run fetch

concurrency:
  group: weights-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Download source artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/weights-src

      - name: Package weights + provenance
        id: pkg
        run: |
          set -euo pipefail
          python3 cloud-gpu/scripts/pack_release_assets.py /tmp/weights-src /tmp/pkg "${{ inputs.release_tag }}" "${{ inputs.expected_pt }}"
          echo "TARBALL=/tmp/${{ inputs.release_tag }}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Publish release (prerelease) with assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
          TITLE: ${{ inputs.release_title }}
        run: |
          set -euo pipefail
          {
            echo '> ⚠️ **candidate_v1_pilot_weights，不是 positive_core_v2，不可入论文；阈值内嵌于每个 .pt。**'
            echo ''
            echo '| 项 | 值 |'
            echo '| --- | --- |'
            echo '| 口径 | candidate_v1（未 Review_Result 回填） |'
            echo '| 来源 | gpu-relay run 43842046392 → kernel shaohuawen/dualamp-real5-20261116 |'
            echo '| 训练 commit | 8a2d232 |'
            echo '| 阳性 SHA256 | 7b6ea12136623e85218ba78cfd4b713985a3122b24c61650e536e724b768aa1d |'
            echo '| 模型 | M1 / M2 / M3 × seeds 1–5（60 ep，5 fold）；M0_RF 为 sklearn，未导出 .pt |'
            echo '| 测试 AUROC | M1 0.9767–0.9791 / M2 0.9796–0.9809 / M3 0.9770–0.9803 |'
            echo ''
            echo '内容：`model/`（15 × .pt）+ `features/biophys_scaler.joblib` + `meta/`（summary、D10/D11/D15、ablation、log、result.json）+ `SHA256SUMS.txt` + `export_manifest.json`。'
            echo ''
            echo '注意：测试集已参与模型比较，不是盲测；positive_core_v2 冻结后仍需正式重训并更新本 release。'
          } > /tmp/release_notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::release tag $TAG already exists — refusing to overwrite"
            exit 1
          fi
          if [ "${{ inputs.publish_mode }}" = "individual" ]; then
            # One asset per checkpoint: the release page must list every .pt so a
            # reviewer can verify "M1/M2/M3 x 5 seeds" without unpacking anything.
            mkdir -p /tmp/assets_name
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease \
              --title "$TITLE" --notes-file /tmp/release_notes.md
            n=0
            for f in /tmp/pkg/model/*.pt; do
              # pack_release_assets strips a leading "model_", which turned
              # model_M1_seed1.pt into only_model_M1_seed1.pt. Normalise back to
              # M<k>_seed<s>.pt so the asset names are unambiguous.
              base="$(basename "$f")"
              clean="$(printf '%s' "$base" | sed -E 's/^(only_)?model_//')"
              cp "$f" "/tmp/assets_name/$clean"
              gh release upload "$TAG" "/tmp/assets_name/$clean" --repo "$GITHUB_REPOSITORY" --clobber
              n=$((n + 1))
            done
            gh release upload "$TAG" /tmp/pkg/SHA256SUMS.txt /tmp/pkg/export_manifest.json \
              --repo "$GITHUB_REPOSITORY" --clobber
            echo "uploaded $n individual checkpoint asset(s)"
            if [ "$n" -ne "${{ inputs.expected_pt }}" ]; then
              echo "::error::expected ${{ inputs.expected_pt }} .pt assets, uploaded $n"
              exit 1
            fi
          else
            gh release create "$TAG" "${{ steps.pkg.outputs.TARBALL }}" /tmp/pkg/SHA256SUMS.txt /tmp/pkg/export_manifest.json \
              --repo "$GITHUB_REPOSITORY" --prerelease --title "$TITLE" --notes-file /tmp/release_notes.md
          fi
          {
            echo '### Release published'
            echo ''
            echo "- tag: $TAG"
            echo "- assets:"
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | "  - \(.name) (\(.size) bytes)"'
          } >> "$GITHUB_STEP_SUMMARY"
