name: weights-release-individual

# Publish each *.pt as its OWN release asset (not one tarball).
#
# Why: the earlier weights-release workflow packaged 15 checkpoints into a single
# .tar.gz, so the release page showed one opaque file instead of 15 inspectable
# weights. Reviewers could not verify "M1/M2/M3 x 5 seeds" from the page itself.
#
# Runs on a GitHub-hosted runner because the Arena sandbox cannot reach the Azure
# blob host that serves workflow artifacts, nor uploads.github.com.
#
# Inputs mirror weights-release.yml; the run id / artifact name identify which
# gpu-relay artifact carries the *.pt files.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'gpu-relay run id to fetch the artifact from'
        required: true
      artifact_name:
        description: 'Artifact name in that run (e.g. gpu-relay-run-132)'
        required: true
      release_tag:
        description: 'Release tag to create (must not already exist)'
        required: true
      release_title:
        description: 'Release title'
        required: true
      expected_pt:
        description: 'Expected number of .pt files (safety check)'
        required: false
        default: '15'

permissions:
  contents: write   # create the release + upload assets
  actions: read     # actions/download-artifact needs this for cross-run fetch

concurrency:
  group: weights-individual-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Download source artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/weights-src

      - name: Collect and verify checkpoints
        id: collect
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, shutil, sys

          src = "/tmp/weights-src"
          out = "/tmp/assets"
          os.makedirs(out, exist_ok=True)

          # Dedupe by basename: the artifact holds both the private run dir and the
          # cloud-gpu/results copy of the same checkpoint. Conflicts abort.
          by_base = {}
          for root, _, names in os.walk(src):
              for n in names:
                  if n.lower().endswith(".pt"):
                      base = n[len("model_"):] if n.startswith("model_") else n
                      by_base.setdefault(base, []).append(os.path.join(root, n))

          def sha(p):
              h = hashlib.sha256()
              with open(p, "rb") as f:
                  for chunk in iter(lambda: f.read(8 << 20), b""):
                      h.update(chunk)
              return h.hexdigest()

          conflicts = [b for b, ps in by_base.items() if len({sha(p) for p in ps}) != 1]
          if conflicts:
              for b in conflicts:
                  print(f"::error::conflicting copies of {b}: {by_base[b]}", file=sys.stderr)
              sys.exit(1)

          rows = []
          for base, paths in sorted(by_base.items()):
              dst = os.path.join(out, base)
              shutil.copy2(paths[0], dst)
              rows.append({"name": base, "bytes": os.path.getsize(dst), "sha256": sha(dst)})

          expect = int(os.environ.get("EXPECT", "0"))
          print(f"checkpoints found: {len(rows)} (expected {expect})")
          for r in rows:
              print(f"  {r['name']}  {r['bytes']} B  {r['sha256'][:16]}...")
          if expect and len(rows) != expect:
              print(f"::error::expected {expect} checkpoints, found {len(rows)}", file=sys.stderr)
              sys.exit(1)

          with open("/tmp/manifest.json", "w") as f:
              json.dump({"expected": expect, "count": len(rows), "files": rows}, f, indent=2)

          with open("/tmp/SHA256SUMS.txt", "w") as f:
              for r in rows:
                  f.write(f"{r['sha256']}  {r['name']}\n")
          PY
        env:
          EXPECT: ${{ inputs.expected_pt }}

      - name: Write release notes
        run: |
          cat > /tmp/release_notes.md <<'MD'
          ## DualAMP v2.1 权重（M1/M2/M3 × seeds 1–5），逐个文件发布

          15 个 `.pt` 单独作为资产列在本页，可直接逐个下载；`SHA256SUMS.txt` 给出逐文件哈希，
          `manifest.json` 给出字节数与期望数量（数量不等于 15 时本 workflow 直接失败）。

          | 项 | 值 |
          | --- | --- |
          | 来源运行 | `shaohuawen/dualamp-v2-1-weights-r4-20261125` |
          | 整包 sha256 | `334bf49ca87ff704ae29900335cc05b4766290b85f32b58eaec0b60f9b09bf3c`（759,753,019 B） |
          | 编码器 | ESM-2 t12 35M 第 12 层 480 维（编码器不在资产内） |

          ### 指标（同一批权重）

          | 模型 | AUROC | MCC | Brier | ECE |
          | --- | --- | --- | --- | --- |
          | M3 | 0.9893 | 0.864 | 0.0302 | 0.0238 |
          | M2 | 0.9889 | 0.873 | 0.0309 | 0.0247 |
          | M1 | 0.9832 | 0.849 | 0.0512 | 0.0597 |

          ### 必须连读的限制

          1. **组成捷径未修复**：诱饵接受率 65.6–70.2%（判据 <10%），`FAIL_COMPOSITION_SHORTCUT`。
          2. 负例为 UniProt 弱负例，非实验阴性；无 MIC 定量。
          3. M3（对照）与 M2 打平，模型间差异在噪声带内。
          4. 本发布经用户明确授权公开，偏离「权重只走私密通道」的默认规则。
          MD

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
          TITLE: ${{ inputs.release_title }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::release tag $TAG already exists — refusing to overwrite"
            exit 1
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "$TITLE" --notes-file /tmp/release_notes.md

      - name: Upload each checkpoint as its own asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          # One asset per checkpoint, named exactly after the file, so the release
          # page lists 15 individually downloadable weights.
          for f in /tmp/assets/*.pt; do
            echo "uploading $(basename "$f")"
            gh release upload "$TAG" "$f" --repo "$GITHUB_REPOSITORY" --clobber
          done
          gh release upload "$TAG" /tmp/SHA256SUMS.txt /tmp/manifest.json \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Verify assets are individually visible
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | "\(.name)  \(.size) B"' | tee /tmp/assets.txt
          count=$(grep -c '\.pt  ' /tmp/assets.txt || true)
          echo "checkpoint assets: $count"
          if [ "$count" -ne "${{ inputs.expected_pt }}" ]; then
            echo "::error::expected ${{ inputs.expected_pt }} .pt assets, found $count"
            exit 1
          fi
          {
            echo '### Published as individual assets'
            echo ''
            echo '```'
            cat /tmp/assets.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
